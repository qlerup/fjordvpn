name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt pytest playwright
      - run: playwright install --with-deps chromium
      - run: pytest tests -q
      - run: python tests/browser_check.py
      - run: docker compose config --quiet
        env:
          DATA_DIR: /tmp/fjordvpn-ci-data
      - run: docker build -t fjordvpn-ci .
