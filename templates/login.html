<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log ind · FjordVPN</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login-page"><main class="login-panel"><div class="brand"><span class="brand-mark">F</span> FjordVPN</div><p class="eyebrow">DIT LOKALE VPN-OVERBLIK</p><h1>Velkommen tilbage</h1><p class="muted">Log ind for at se og administrere dine forbindelser.</p>
<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Brugernavn<input name="username" value="admin" autocomplete="username" required></label><label>Adgangskode<input type="password" name="password" autocomplete="current-password" required autofocus></label>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<button class="primary full">Log ind →</button></form><p class="small muted">Administrationen er tilgængelig på dit lokalnet.</p></main></body></html>
